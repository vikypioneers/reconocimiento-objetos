<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reconocimiento de Objetos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div
        id="pantallaRobot"
        class="pantalla-robot"
    >

        <!-- ==================================================
             VIDEO DEL ROBOT
             ================================================== -->

        <video
            id="robotVideo"
            class="robot-video"
            src="/videos/espera.mp4"
            autoplay
            muted
            loop
            playsinline
        ></video>


        <!-- ==================================================
             INFORMACIÓN
             ================================================== -->

        <div
            id="informacion"
            class="informacion"
        >

            <div
                id="estado"
                class="estado"
            >
                Observando...
            </div>

            <div
                id="objetoDetectado"
                class="objeto-detectado"
            ></div>

        </div>


        <!-- ==================================================
             CÁMARA INVISIBLE
             ================================================== -->

        <video
            id="camera"
            autoplay
            muted
            playsinline
        ></video>


        <!-- ==================================================
             CANVAS INVISIBLE
             ================================================== -->

        <canvas
            id="canvas"
        ></canvas>


        <!-- ==================================================
             PANTALLA COMPLETA
             ================================================== -->

        <button
            id="botonPantallaCompleta"
            class="boton-pantalla-completa"
            onclick="pantallaCompleta()"
            type="button"
            aria-label="Pantalla completa"
        >
            ⛶
        </button>

    </div>


    <!-- ======================================================
         JAVASCRIPT
         ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/camera.js') }}"
    ></script>

</body>

</html>
